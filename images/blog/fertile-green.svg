<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="greenWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4a8c5c" stop-opacity="0.45"/>
      <stop offset="55%"  stop-color="#6aab78" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#6aab78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <filter id="gentle">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#faf7f4"/>

  <!-- Main green wash -->
  <ellipse cx="600" cy="315" rx="440" ry="300" fill="url(#greenWash)" filter="url(#soft)"/>

  <!-- Centre bloom -->
  <ellipse cx="600" cy="315" rx="180" ry="160" fill="url(#innerGlow)" filter="url(#soft)"/>

  <!-- Growth rings — concentric circles, barely there -->
  <circle cx="600" cy="315" r="240" fill="none" stroke="#4a8c5c" stroke-width="0.8" stroke-opacity="0.12"/>
  <circle cx="600" cy="315" r="170" fill="none" stroke="#4a8c5c" stroke-width="0.8" stroke-opacity="0.15"/>
  <circle cx="600" cy="315" r="110" fill="none" stroke="#4a8c5c" stroke-width="0.8" stroke-opacity="0.18"/>
  <circle cx="600" cy="315" r="58"  fill="none" stroke="#4a8c5c" stroke-width="0.8" stroke-opacity="0.22"/>

  <!-- Small filled centre dot -->
  <circle cx="600" cy="315" r="6" fill="#4a8c5c" fill-opacity="0.25" filter="url(#gentle)"/>

  <!-- Top caption -->
  <text x="600" y="88" text-anchor="middle" fill="#5a524e" font-size="10" letter-spacing="4" font-family="Georgia, serif" opacity="0.38">FERTILE GREEN</text>

  <!-- Label -->
  <text x="600" y="520" text-anchor="middle" fill="#4a8c5c" font-size="11" letter-spacing="5" font-family="Georgia, serif" opacity="0.65">GREEN</text>
  <text x="600" y="542" text-anchor="middle" fill="#5a524e" font-size="10" letter-spacing="2" font-family="Georgia, serif" opacity="0.45">growth · creativity · openness</text>

  <!-- Source note -->
  <text x="600" y="590" text-anchor="middle" fill="#5a524e" font-size="9" letter-spacing="2" font-family="Georgia, serif" opacity="0.30">LICHTENFELD ET AL., 2012</text>
</svg>
