<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a0a0a"/>
      <stop offset="50%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b1a1a" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a3a6b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2471a3" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="redOrb" cx="35%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueOrb" cx="65%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#2980b9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1a5276" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="leftHalf">
      <rect x="0" y="0" width="600" height="630"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="600" y="0" width="600" height="630"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="420" cy="315" rx="320" ry="240" fill="url(#redOrb)" filter="url(#blur)"/>
  <ellipse cx="780" cy="315" rx="320" ry="240" fill="url(#blueOrb)" filter="url(#blur)"/>

  <!-- Dividing line, subtle -->
  <line x1="600" y1="60" x2="600" y2="570" stroke="#ffffff" stroke-width="1" stroke-opacity="0.12"/>

  <!-- ── LEFT SIDE: RED / PRECISION ── -->

  <!-- Grid lines suggesting precision/structure -->
  <g stroke="#e74c3c" stroke-opacity="0.18" stroke-width="1" clip-path="url(#leftHalf)">
    <!-- Horizontal grid -->
    <line x1="80"  y1="180" x2="560" y2="180"/>
    <line x1="80"  y1="240" x2="560" y2="240"/>
    <line x1="80"  y1="300" x2="560" y2="300"/>
    <line x1="80"  y1="360" x2="560" y2="360"/>
    <line x1="80"  y1="420" x2="560" y2="420"/>
    <!-- Vertical grid -->
    <line x1="140" y1="140" x2="140" y2="490"/>
    <line x1="220" y1="140" x2="220" y2="490"/>
    <line x1="300" y1="140" x2="300" y2="490"/>
    <line x1="380" y1="140" x2="380" y2="490"/>
    <line x1="460" y1="140" x2="460" y2="490"/>
    <line x1="540" y1="140" x2="540" y2="490"/>
  </g>

  <!-- Precise geometric shapes - red side -->
  <!-- Small perfect squares (precision markers) -->
  <rect x="138" y="178" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="218" y="178" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="298" y="178" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="378" y="178" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="458" y="178" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="138" y="238" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="218" y="238" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="298" y="238" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="378" y="238" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="458" y="238" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="138" y="298" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="218" y="298" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="298" y="298" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="378" y="298" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="458" y="298" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="138" y="358" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="218" y="358" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="298" y="358" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="378" y="358" width="4" height="4" fill="#e74c3c" opacity="0.9"/>
  <rect x="458" y="358" width="4" height="4" fill="#e74c3c" opacity="0.9"/>

  <!-- Large red circle outline -->
  <circle cx="300" cy="315" r="130" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="300" cy="315" r="80"  fill="none" stroke="#e74c3c" stroke-width="1"   stroke-opacity="0.35"/>
  <circle cx="300" cy="315" r="30"  fill="none" stroke="#e74c3c" stroke-width="2"   stroke-opacity="0.7"/>
  <!-- Target dot -->
  <circle cx="300" cy="315" r="5"   fill="#e74c3c" opacity="1"/>

  <!-- Crosshair lines -->
  <line x1="300" y1="175" x2="300" y2="245" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="300" y1="385" x2="300" y2="455" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="160" y1="315" x2="230" y2="315" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="370" y1="315" x2="440" y2="315" stroke="#e74c3c" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- ── RIGHT SIDE: BLUE / CREATIVITY ── -->

  <!-- Organic flowing curves - blue side -->
  <g fill="none" stroke="#2980b9" stroke-opacity="0.5" clip-path="url(#rightHalf)">
    <path d="M 640 500 Q 720 300 800 200 Q 880 100 960 180 Q 1040 260 1100 200" stroke-width="1.5"/>
    <path d="M 620 450 Q 700 280 790 240 Q 880 200 940 280 Q 1000 360 1080 300" stroke-width="1.5"/>
    <path d="M 660 540 Q 740 400 810 320 Q 880 240 970 280 Q 1060 320 1110 260" stroke-width="1.5" stroke-opacity="0.3"/>
    <path d="M 630 400 Q 710 260 790 300 Q 870 340 930 260 Q 990 180 1070 220" stroke-width="1" stroke-opacity="0.3"/>
  </g>

  <!-- Scattered organic circles suggesting ideas/creativity -->
  <circle cx="700" cy="200" r="40"  fill="none" stroke="#2980b9" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="860" cy="260" r="65"  fill="none" stroke="#2980b9" stroke-width="1" stroke-opacity="0.35"/>
  <circle cx="1020" cy="350" r="45" fill="none" stroke="#2980b9" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="750" cy="400" r="30"  fill="none" stroke="#3498db" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="950" cy="180" r="20"  fill="none" stroke="#3498db" stroke-width="1" stroke-opacity="0.5"/>
  <circle cx="1080" cy="430" r="55" fill="none" stroke="#2980b9" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Filled blue dots (idea nodes) -->
  <circle cx="700"  cy="200" r="5"  fill="#3498db" opacity="0.9"/>
  <circle cx="860"  cy="260" r="5"  fill="#3498db" opacity="0.9"/>
  <circle cx="1020" cy="350" r="5"  fill="#3498db" opacity="0.9"/>
  <circle cx="750"  cy="400" r="4"  fill="#3498db" opacity="0.7"/>
  <circle cx="950"  cy="180" r="4"  fill="#3498db" opacity="0.7"/>
  <circle cx="1080" cy="430" r="5"  fill="#3498db" opacity="0.9"/>
  <!-- Connector lines between idea nodes -->
  <line x1="700"  y1="200" x2="860"  y2="260" stroke="#3498db" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="860"  y1="260" x2="1020" y2="350" stroke="#3498db" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="700"  y1="200" x2="950"  y2="180" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="860"  y1="260" x2="750"  y2="400" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="1020" y1="350" x2="1080" y2="430" stroke="#3498db" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="950"  y1="180" x2="1020" y2="350" stroke="#3498db" stroke-width="1" stroke-opacity="0.25"/>

  <!-- ── TEXT LABELS ── -->

  <!-- Red side label -->
  <text x="300" y="520" text-anchor="middle" fill="#e74c3c" font-size="11" letter-spacing="4" opacity="0.8" font-family="Georgia, serif">PRECISION</text>
  <text x="300" y="540" text-anchor="middle" fill="#ffffff" font-size="9" letter-spacing="2" opacity="0.4" font-family="Georgia, serif">detail · focus · accuracy</text>

  <!-- Blue side label -->
  <text x="900" y="520" text-anchor="middle" fill="#3498db" font-size="11" letter-spacing="4" opacity="0.8" font-family="Georgia, serif">CREATIVITY</text>
  <text x="900" y="540" text-anchor="middle" fill="#ffffff" font-size="9" letter-spacing="2" opacity="0.4" font-family="Georgia, serif">ideas · connection · openness</text>

  <!-- Top caption -->
  <text x="600" y="90" text-anchor="middle" fill="#ffffff" font-size="10" letter-spacing="3" opacity="0.35" font-family="Georgia, serif">COLOUR AND COGNITIVE PERFORMANCE</text>
  <text x="600" y="108" text-anchor="middle" fill="#ffffff" font-size="9" letter-spacing="2" opacity="0.2" font-family="Georgia, serif">Mehta &amp; Zhu, Science 2009</text>

</svg>
