<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="redWash" cx="38%" cy="52%" r="42%">
      <stop offset="0%"   stop-color="#d4614a" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#c0392b" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueWash" cx="62%" cy="48%" r="42%">
      <stop offset="0%"   stop-color="#4a90b8" stop-opacity="0.50"/>
      <stop offset="60%"  stop-color="#2471a3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2471a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="midGlow" cx="50%" cy="50%" r="25%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="softer">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="subtle">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Warm cream background -->
  <rect width="1200" height="630" fill="#faf7f4"/>

  <!-- Soft colour washes -->
  <ellipse cx="390" cy="315" rx="380" ry="270" fill="url(#redWash)"  filter="url(#soft)"/>
  <ellipse cx="810" cy="315" rx="380" ry="270" fill="url(#blueWash)" filter="url(#soft)"/>

  <!-- Gentle centre bloom -->
  <ellipse cx="600" cy="315" rx="200" ry="180" fill="url(#midGlow)" filter="url(#softer)"/>

  <!-- Red side — one soft circle, barely there -->
  <circle cx="330" cy="295" r="120" fill="#c0392b" fill-opacity="0.07" filter="url(#subtle)"/>
  <circle cx="330" cy="295" r="60"  fill="#c0392b" fill-opacity="0.10" filter="url(#subtle)"/>

  <!-- Blue side — matching soft circle -->
  <circle cx="870" cy="335" r="120" fill="#2471a3" fill-opacity="0.07" filter="url(#subtle)"/>
  <circle cx="870" cy="335" r="60"  fill="#2471a3" fill-opacity="0.10" filter="url(#subtle)"/>

  <!-- Thin dividing line, very faint -->
  <line x1="600" y1="120" x2="600" y2="510" stroke="#1f1b1a" stroke-width="0.8" stroke-opacity="0.10"/>

  <!-- Text — left -->
  <text x="330" y="490" text-anchor="middle" fill="#c0392b" font-size="11" letter-spacing="5" font-family="Georgia, serif" opacity="0.7">RED</text>
  <text x="330" y="512" text-anchor="middle" fill="#5a524e" font-size="10" letter-spacing="2" font-family="Georgia, serif" opacity="0.5">precision · detail · focus</text>

  <!-- Text — right -->
  <text x="870" y="490" text-anchor="middle" fill="#2471a3" font-size="11" letter-spacing="5" font-family="Georgia, serif" opacity="0.7">BLUE</text>
  <text x="870" y="512" text-anchor="middle" fill="#5a524e" font-size="10" letter-spacing="2" font-family="Georgia, serif" opacity="0.5">creativity · openness · ideas</text>

  <!-- Top caption, barely visible -->
  <text x="600" y="100" text-anchor="middle" fill="#5a524e" font-size="9" letter-spacing="3" font-family="Georgia, serif" opacity="0.35">COLOUR AND THE MIND</text>
</svg>
